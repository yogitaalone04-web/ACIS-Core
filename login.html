<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberImmune - Secure Terminal Authentication</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="dark-theme login-body">
    <div class="login-wrapper">
        <!-- Background Grid Effect -->
        <div class="cyber-grid-overlay"></div>

        <div class="login-card">
            <div class="login-header">
                <div class="brand-logo">
                    <i class="fa-solid fa-shield-halved glow-shield"></i>
                </div>
                <h2>Autonomous CyberImmune</h2>
                <p class="subtitle">Secure Operational Authentication Gateway</p>
                <div class="clearance-badge">
                    <i class="fa-solid fa-lock"></i> TOP SECRET // RESTRICTED ACCESS
                </div>
            </div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username"><i class="fa-solid fa-user-shield"></i> Operator ID / Security Email</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" placeholder="admin@cyberimmune.ai" required value="admin@cyberimmune.ai">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password"><i class="fa-solid fa-key"></i> Quantum Key / Access Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="••••••••••••••••" required value="CyberShield2026!">
                    </div>
                </div>

                <div class="form-group">
                    <label for="clearance"><i class="fa-solid fa-user-gear"></i> Role Clearance</label>
                    <div class="input-wrapper">
                        <select id="clearance">
                            <option value="admin">SecOps Administrator (Level 5)</option>
                            <option value="analyst">Security Threat Analyst (Level 3)</option>
                            <option value="auditor">Compliance & AI Auditor (Level 2)</option>
                        </select>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox" checked>
                        <span class="checkmark"></span>
                        Keep Neural Session Active
                    </label>
                    <a href="#" class="forgot-link" onclick="triggerMFA()">Enforce Biometric MFA</a>
                </div>

                <button type="submit" class="btn btn-login" id="loginBtn">
                    <i class="fa-solid fa-right-to-bracket"></i> Authenticate System Session
                </button>
            </form>

            <div class="login-footer">
                <p><i class="fa-solid fa-fingerprint"></i> Biometric Hardware Key Supported</p>
                <span class="status-indicator"><span class="status-dot"></span> Auth Server: 100% Operational</span>
            </div>
        </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Verifying Credentials & RSA Signatures...';
            btn.disabled = true;

            setTimeout(() => {
                btn.innerHTML = '<i class="fa-solid fa-circle-check"></i> Access Granted! Redirecting...';
                btn.style.background = 'linear-gradient(135deg, #00e676, #00b0ff)';
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 800);
            }, 1200);
        }

        function triggerMFA() {
            alert('Hardware Passkey prompt initiated. Insert your YubiKey or scan WebAuthn fingerprint.');
        }
    </script>
</body>
</html>
