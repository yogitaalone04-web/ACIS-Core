<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ACIS-Core Login</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-left">
            <div class="brand">
                <h1>ACIS-Core</h1>
                <p>Autonomous Cyberimmune</p>
                <p class="tagline">Secure Operational Authentication Gateway</p>
            </div>
            <div class="classification">
                <span>TOP SECRET // RESTRICTED ACCESS</span>
            </div>
        </div>
        <div class="login-right">
            <div class="form-wrapper">
                <div class="form-header">
                    <i class="fas fa-shield-alt"></i>
                    <h2>Operator Authentication</h2>
                </div>
                <form id="loginForm">
                    <div class="input-group">
                        <label>Operator ID / Security Email</label>
                        <div class="input-field">
                            <i class="fas fa-user"></i>
                            <input type="email" id="email" value="admin@cyberimmune.ai" required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Quantum Key / Access Password</label>
                        <div class="input-field">
                            <i class="fas fa-key"></i>
                            <input type="password" id="password" value="SecurePass123" required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Role Clearance</label>
                        <div class="input-field">
                            <i class="fas fa-id-badge"></i>
                            <select id="role">
                                <option>SecOps Administrator (Level 5)</option>
                                <option>Cyber Analyst (Level 4)</option>
                                <option>Security Engineer (Level 3)</option>
                                <option>Observer (Level 2)</option>
                                <option>Guest (Level 1)</option>
                            </select>
                        </div>
                    </div>
                    <div class="checkbox-group">
                        <label class="checkbox-item"><input type="checkbox" checked><span>Keep Neural Session Active</span></label>
                        <label class="checkbox-item"><input type="checkbox"><span>Enforce Biometric MFA</span></label>
                    </div>
                    <button type="submit" class="login-btn" id="loginBtn">
                        <i class="fas fa-lock"></i> Authenticate
                    </button>
                </form>
                <div class="footer-note">
                    <i class="fas fa-microchip"></i> Cyberimmune-SecureTerminal v2.0
                </div>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
            btn.disabled = true;
            try {
                const res = await fetch('http://127.0.0.1:5001/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value,
                        role: document.getElementById('role').value
                    })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('user', JSON.stringify(data));
                    alert('✅ Login successful!');
                    window.location.href = 'index.html';
                } else {
                    alert('❌ Login failed: ' + data.message);
                }
            } catch (err) {
                alert('❌ Server not running! Start backend first.');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });
        if (localStorage.getItem('user')) {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
