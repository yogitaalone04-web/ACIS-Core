<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACIS-Core | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: #F1F5F9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            display: flex;
            width: 1000px;
            max-width: 100%;
            min-height: 560px;
            background: #FFFFFF;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
            border: 1px solid #e2e8f0;
        }

        .login-left {
            flex: 1.2;
            background: #F8FAFC;
            padding: 40px 32px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-right: 1px solid #e2e8f0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .brand .shield-icon {
            color: #64748b;
            font-size: 2rem;
        }

        .brand h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0F172A;
            letter-spacing: -0.5px;
        }

        .brand p {
            color: #475569;
            font-size: 0.9rem;
            margin-top: 2px;
        }

        .tagline {
            color: #64748b;
            font-size: 0.8rem;
            border-left: 3px solid #64748b;
            padding-left: 14px;
            margin-top: 4px;
        }

        .classification {
            padding: 10px 14px;
            border: 1px solid #dc2626;
            border-radius: 6px;
            background: #fef2f2;
            text-align: center;
        }

        .classification span {
            color: #dc2626;
            font-weight: 700;
            font-size: 0.7rem;
            letter-spacing: 2px;
        }

        .login-right {
            flex: 1.5;
            padding: 40px 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #FFFFFF;
        }

        .form-wrapper {
            width: 100%;
            max-width: 380px;
        }

        .form-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .form-header i {
            font-size: 1.4rem;
            color: #64748b;
        }

        .form-header h2 {
            color: #0F172A;
            font-weight: 500;
            font-size: 1.1rem;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            color: #475569;
            font-size: 0.75rem;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .input-field {
            display: flex;
            align-items: center;
            background: #f1f5f9;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            transition: 0.2s;
        }

        .input-field:focus-within {
            border-color: #64748b;
            box-shadow: 0 0 0 3px rgba(100, 116, 139, 0.1);
        }

        .input-field i {
            color: #94a3b8;
            padding: 0 12px;
            font-size: 0.9rem;
        }

        .input-field input,
        .input-field select {
            width: 100%;
            padding: 12px 12px 12px 0;
            background: transparent;
            border: none;
            outline: none;
            color: #0F172A;
            font-size: 0.9rem;
        }

        .input-field select {
            cursor: pointer;
            appearance: none;
        }

        .input-field select option {
            background: #FFFFFF;
            color: #0F172A;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin: 18px 0 24px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #475569;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .checkbox-item input[type="checkbox"] {
            accent-color: #64748b;
            width: 15px;
            height: 15px;
            cursor: pointer;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            background: #64748b;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-btn:hover {
            background: #475569;
            transform: translateY(-1px);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .footer-note {
            margin-top: 20px;
            text-align: center;
            color: #94a3b8;
            font-size: 0.7rem;
        }

        .footer-note i {
            color: #64748b;
            margin-right: 4px;
        }

        @media (max-width: 768px) {
            .login-container {
                flex-direction: column;
                min-height: auto;
                border-radius: 12px;
            }
            .login-left {
                border-right: none;
                border-bottom: 1px solid #e2e8f0;
                padding: 24px 20px;
            }
            .login-right {
                padding: 24px 20px;
            }
            .brand h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Left Panel -->
        <div class="login-left">
            <div>
                <div class="brand">
                    <i class="fas fa-shield-halved shield-icon"></i>
                    <h1>ACIS-Core</h1>
                </div>
                <p>Autonomous Cyberimmune</p>
                <p class="tagline">Secure Operational Authentication Gateway</p>
            </div>
            <div class="classification">
                <span>TOP SECRET // RESTRICTED ACCESS</span>
            </div>
        </div>

        <!-- Right Panel -->
        <div class="login-right">
            <div class="form-wrapper">
                <div class="form-header">
                    <i class="fas fa-shield-alt"></i>
                    <h2>Operator Authentication</h2>
                </div>

                <form id="loginForm">
                    <div class="input-group">
                        <label>Operator ID / Security Email</label>
                        <div class="input-field">
                            <i class="fas fa-user"></i>
                            <input type="email" id="email" value="admin@cyberimmune.ai" required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Quantum Key / Access Password</label>
                        <div class="input-field">
                            <i class="fas fa-key"></i>
                            <input type="password" id="password" value="SecurePass123" required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Role Clearance</label>
                        <div class="input-field">
                            <i class="fas fa-id-badge"></i>
                            <select id="role">
                                <option>SecOps Administrator (Level 5)</option>
                                <option>Cyber Analyst (Level 4)</option>
                                <option>Security Engineer (Level 3)</option>
                                <option>Observer (Level 2)</option>
                                <option>Guest (Level 1)</option>
                            </select>
                        </div>
                    </div>

                    <div class="checkbox-group">
                        <label class="checkbox-item">
                            <input type="checkbox" checked>
                            <span>Keep Neural Session Active</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox">
                            <span>Enforce Biometric MFA</span>
                        </label>
                    </div>

                    <button type="submit" class="login-btn" id="loginBtn">
                        <i class="fas fa-lock"></i> Authenticate
                    </button>
                </form>

                <div class="footer-note">
                    <i class="fas fa-microchip"></i> Cyberimmune-SecureTerminal v2.0
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
            btn.disabled = true;

            try {
                const res = await fetch('http://127.0.0.1:5001/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value,
                        role: document.getElementById('role').value
                    })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('user', JSON.stringify(data));
                    alert('✅ Login successful!');
                    window.location.href = 'index.html';
                } else {
                    alert('❌ Login failed: ' + data.message);
                }
            } catch (err) {
                alert('❌ Server not running! Start backend first.');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });

        // Auto-redirect if already logged in
        if (localStorage.getItem('user')) {
            window.location.href = 'index.html';
        }
    </script>

</body>
</html>
